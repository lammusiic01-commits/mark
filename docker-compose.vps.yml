version: "3.9"

services:
  singbox-vps:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: tenda-singbox-vps
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - ./configs/generated/singbox_vps.json:/etc/sing-box/config.json:ro
    command: run -c /etc/sing-box/config.json
