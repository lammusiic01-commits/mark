# ═══════════════════════════════════════════════════════════════
#   AI Маркетолог — локальный и серверный стенд
#
#   Секреты берутся ТОЛЬКО из secrets.env (--env-file secrets.env).
#   Сервисы api / bot / webapp включаются профилями: start.bat и
#   start.sh подключают ровно те, что уже собраны в проекте.
#
#   postgres и redis живут во внутренней сети без выхода в интернет,
#   api и bot — в обеих сетях: им нужен и интернет (Директ, Telegram).
# ═══════════════════════════════════════════════════════════════

name: ai-marketer

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ─── База данных ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ai-marketer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ai_marketer}
      POSTGRES_USER: ${DB_USER:-marketer}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Задайте DB_PASSWORD в secrets.env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-marketer} -d ${DB_NAME:-ai_marketer}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging
    networks:
      - internal

  # ─── Redis: кэш статистики, статусы платежей, очереди ────────
  redis:
    image: redis:7-alpine
    container_name: ai-marketer-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    networks:
      - internal

  # ─── Миграции: одноразовый контейнер (alembic upgrade head) ──
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-marketer-migrate
    profiles: ["migrate"]
    command: ["alembic", "upgrade", "head"]
    env_file:
      - secrets.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging
    networks:
      - internal

  # ─── API (FastAPI) ──────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-marketer-api
    profiles: ["api"]
    command:
      - sh
      - -c
      - uvicorn api.server:app --host 0.0.0.0 --port ${API_PORT:-8000} --proxy-headers
    env_file:
      - secrets.env
    environment:
      API_PORT: ${API_PORT:-8000}
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal
      - public

  # ─── Telegram-бот (aiogram 3, long-polling через прокси) ────
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-marketer-bot
    profiles: ["bot"]
    command: ["python", "-m", "bot.main"]
    env_file:
      - secrets.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal
      - public

  # ─── WebApp: собранный Vue 3 (nginx) ────────────────────────
  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    container_name: ai-marketer-webapp
    profiles: ["web"]
    ports:
      - "${WEBAPP_PORT:-3000}:80"
    depends_on:
      - api
    restart: unless-stopped
    logging: *default-logging
    networks:
      - public

volumes:
  pgdata:
    name: ai-marketer-pgdata
  redisdata:
    name: ai-marketer-redisdata

networks:
  # Внутренняя сеть без выхода в интернет: база и Redis изолированы
  internal:
    name: ai-marketer-internal
    internal: true
  # Публичная сеть: api, bot, webapp — им нужен доступ к сервисам и Telegram
  public:
    name: ai-marketer-public
