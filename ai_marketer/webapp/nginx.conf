# nginx внутри контейнера webapp: раздаёт собранное приложение и передаёт
# запросы /api серверу API по внутренней сети docker (имя сервиса — api).

upstream ai_marketer_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Безопасные заголовки: приложение открывается только по https
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API: тот же origin для браузера, никаких внешних адресов в коде страницы
    location /api/ {
        proxy_pass http://ai_marketer_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Telegram-Init-Data $http_x_telegram_init_data;
        proxy_read_timeout 180s;   # выгрузка визитов из Метрики бывает долгой
        proxy_send_timeout 180s;
    }

    location = /health {
        proxy_pass http://ai_marketer_api/health;
        proxy_set_header Host $host;
    }

    # Статика с длинным кэшем: файлы содержат хеш в имени
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Приложение — SPA на hash-роутере: любой путь отдаёт index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
