# Автоматически сгенерированный конфиг Dnsmasq для роутера Tenda TX2
interface=eth0
bind-dynamic
no-resolv
bogus-priv
domain-needed
cache-size=10000
min-cache-ttl=60

# Перенаправление всех DNS-запросов в Sing-box (Split-DNS + FakeIP на порту 5353)
server=127.0.0.1#5353
# Прямой резолвинг .ru и .рф через быстрый российский DNS (77.88.8.8)
server=/ru/xn--p1ai/su/77.88.8.8
server=/ru/xn--p1ai/su/77.88.8.1

# DHCP-сервер для локальной сети Tenda TX2 (Wi-Fi + LAN-кабель)
dhcp-range=192.168.0.50,192.168.0.240,255.255.255.0,12h
# Option 3: Шлюз по умолчанию -> наш прозрачный ускоритель
dhcp-option=3,192.168.0.2
# Option 6: DNS-сервер -> наш прозрачный ускоритель
dhcp-option=6,192.168.0.2
# Исключаем сам роутер Tenda TX2 (192.168.0.1) из пула
dhcp-authoritative
