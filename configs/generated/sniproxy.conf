# SNIProxy конфигурация (прозрачное проксирование TLS 1.3 и HTTP без расшифровки трафика)
user daemon
pidfile /var/run/sniproxy.pid

resolver {
    nameserver 1.1.1.1
    nameserver 8.8.8.8
    mode ipv4_only
}

listen 0.0.0.0:80 {
    proto http
    table selective_hosts
}

listen 0.0.0.0:443 {
    proto tls
    table selective_hosts
}

table selective_hosts {
    .*youtube\.com$ *
    .*www\.youtube\.com$ *
    .*m\.youtube\.com$ *
    .*music\.youtube\.com$ *
    .*tv\.youtube\.com$ *
